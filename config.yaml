# ─────────────────────────────────────────────
#  레이브 주식 자동매매 설정
#  웹앱(index.html)에서 고치면 이 파일이 자동으로 바뀝니다.
#  금액은 쉼표 없이 숫자만 쓰세요.
# ─────────────────────────────────────────────

settings:
  dry_run: false                # true = 모의(주문 안 나감) / false = 실전 주문
  check_interval_sec: 5        # 몇 초마다 가격을 확인할지
  order_timeout_sec: 60        # 매수 주문이 이 시간(초) 안에 안 사지면 취소 후 다시 판단
  max_budget_per_stock: 10000000   # 안전장치: 한 종목 예산 한도
  trade_start: "09:00"         # 매매 시작 시각
  trade_end: "15:19"           # 매매 종료 시각

stocks:
  - id: "tmw1w06t2"                 # 주문 카드 번호 (바꾸지 마세요)
    name: "SK하이닉스"
    symbol: "000660"           # 종목코드 6자리
    enabled: true              # false = 이 종목은 쉼
    budget: 3000000            # 이 종목에 쓸 금액
    buy_min: 1220000            # 매수 범위 시작
    buy_max: 1225000            # 매수 범위 끝
    sell_min: 1450000           # 이 주문으로 산 묶음: 이 가격 이상이면 전량 매도
    stop_loss: 1100000          # 이 주문으로 산 묶음: 이 가격 이하면 전량 손절
    round: 0                  # 숫자가 바뀌면 같은 조건으로 새 주문

  - id: "tmw2urrjf"                 # 주문 카드 번호 (바꾸지 마세요)
    name: "삼성전자"
    symbol: "005930"           # 종목코드 6자리
    enabled: true              # false = 이 종목은 쉼
    budget: 10000000            # 이 종목에 쓸 금액
    buy_min: 200000            # 매수 범위 시작
    buy_max: 201000            # 매수 범위 끝
    sell_min: 230000           # 이 주문으로 산 묶음: 이 가격 이상이면 전량 매도
    stop_loss: 180000          # 이 주문으로 산 묶음: 이 가격 이하면 전량 손절
    round: 0                  # 숫자가 바뀌면 같은 조건으로 새 주문

# 웹앱에서 '조건 해제'한 보유 묶음 (봇이 더 이상 팔지 않음)
released_lots: []
