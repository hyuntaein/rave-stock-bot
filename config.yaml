# ─────────────────────────────────────────────
#  레이브 주식 자동매매 설정
#  이 파일만 고치면 됩니다. 봇이 켜져 있어도 저장하면 자동으로 다시 읽습니다.
#  금액은 쉼표 없이 숫자만 쓰세요. (210,000 ❌  → 210000 ⭕)
# ─────────────────────────────────────────────

settings:
  dry_run: true                # true = 모의(주문 안 나감) / false = 실전 주문
                               # 처음엔 꼭 true로 며칠 돌려보고 로그를 확인하세요
  check_interval_sec: 5        # 몇 초마다 가격을 확인할지
  order_timeout_sec: 60        # 매수 주문이 이 시간(초) 동안 다 안 사지면 취소 후 다시 판단
  max_budget_per_stock: 10000000   # 안전장치: 한 종목 예산이 이 금액을 넘으면 봇이 시작 안 함 (오타 방지)
  trade_start: "09:00"         # 매매 시작 시각
  trade_end: "15:19"           # 매매 종료 시각 (15:20부터는 종가 동시호가라 제외)

stocks:
  - name: 삼성전자
    symbol: "005930"           # 종목코드 6자리 (따옴표 유지)
    enabled: true              # false로 바꾸면 이 종목은 쉼
    budget: 2000000            # 이 종목에 쓸 금액
    buy_min: 210000            # 이 가격 ~
    buy_max: 212000            # ~ 이 가격 사이일 때 매수 (212,000원보다 비싸게는 안 삼)
    sell_min: 220000           # 이 가격 이상이면 전량 매도
    stop_loss: 190000          # 이 가격 이하로 떨어지면 전량 손절
    account_sync: true         # true  = 토스 계좌 실제 수량을 따라감 (핸드폰으로 사고판 것 반영)
                               #         → 매도·손절 때 계좌에 있는 이 종목 '전부'를 팖
                               #         → 매수는 예산 목표 수량에서 이미 가진 수량을 뺀 만큼만
                               # false = 봇이 직접 산 수량만 관리 (원래 갖고 있던 주식은 안 건드림)

  # 종목을 더 추가하려면 아래 예시처럼 '- name:' 부터 통째로 복사해서 붙이세요
  # - name: SK하이닉스
  #   symbol: "000660"
  #   enabled: true
  #   budget: 1000000
  #   buy_min: 0
  #   buy_max: 0
  #   sell_min: 0
  #   stop_loss: 0
  #   account_sync: true
